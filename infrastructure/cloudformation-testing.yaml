AWSTemplateFormatVersion: '2010-09-09'
Description: S3 and IAM resources for Amazon Bedrock evaluation datasets and results.

Parameters:
  ProjectPrefix:
    Type: String
    Default: online-shop-support

Resources:
  EvalDatasetBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  BedrockEvalRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectPrefix}-bedrock-eval-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EvaluationDataAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt EvalDatasetBucket.Arn
                  - !Sub '${EvalDatasetBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: '*'

Outputs:
  EvalDatasetBucketName:
    Value: !Ref EvalDatasetBucket
  BedrockEvalRoleArn:
    Value: !GetAtt BedrockEvalRole.Arn
